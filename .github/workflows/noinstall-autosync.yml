name: noinstall-autosync

# Watches upstream azahar-emu/azahar for new stable releases and release
# candidates. For the newest unprocessed one, merges the noinstall/core
# feature branch onto the upstream release tag, builds macOS/Windows/Android,
# and publishes a "<tag>-noinstall" release on this fork with all artifacts.
# Processes one release per run; if another is pending it re-dispatches
# itself (and the daily schedule is a fallback). On merge conflict the run
# fails with instructions in the summary (GitHub emails on workflow failure).

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      prerelease: ${{ steps.find.outputs.prerelease }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - name: Find newest unprocessed upstream release
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases=$(gh api 'repos/azahar-emu/azahar/releases?per_page=20')
          stable=$(echo "$releases" | jq '[.[] | select(.prerelease == false and .draft == false)] | first')
          rc=$(echo "$releases" | jq '[.[] | select(.prerelease == true and .draft == false)] | first')

          candidates='[]'
          if [ "$(echo "$stable" | jq -r 'type')" = "object" ]; then
            candidates=$(echo "$candidates" | jq --argjson r "$stable" '. + [{tag: $r.tag_name, prerelease: false}]')
          fi
          if [ "$(echo "$rc" | jq -r 'type')" = "object" ]; then
            # Only consider an RC that is newer than the latest stable release
            newer=$(jq -n --argjson s "$stable" --argjson r "$rc" '($s | type) != "object" or ($r.published_at > $s.published_at)')
            if [ "$newer" = "true" ]; then
              candidates=$(echo "$candidates" | jq --argjson r "$rc" '. + [{tag: $r.tag_name, prerelease: true}]')
            fi
          fi

          echo "any=false" >> "$GITHUB_OUTPUT"
          for row in $(echo "$candidates" | jq -c '.[]'); do
            tag=$(echo "$row" | jq -r .tag)
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}-noinstall" >/dev/null 2>&1; then
              echo "Tag ${tag}-noinstall already exists, skipping"
              continue
            fi
            echo "Processing: $row"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "prerelease=$(echo "$row" | jq -r .prerelease)" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
            break
          done

  prepare:
    needs: check
    if: ${{ needs.check.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply NoInstall commits onto ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          tag='${{ needs.check.outputs.tag }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/azahar-emu/azahar.git
          git fetch upstream "refs/tags/${tag}:refs/tags/${tag}"
          # A manually prepared (e.g. conflict-resolved) branch takes
          # precedence and is reused as-is.
          if git ls-remote --exit-code origin "refs/heads/noinstall/${tag}" >/dev/null; then
            echo "Branch noinstall/${tag} already exists on origin; reusing it."
            exit 0
          fi
          # Only the feature's own commits are applied - merging the whole
          # branch would drag along all of upstream master since the fork
          # point, which conflicts with older release tags.
          #
          # "--not refs/tags/${tag}" additionally drops anything the release
          # tag already contains. Without it a stale origin/master (one that
          # does not yet contain ${tag}) drags the merge-base backwards and
          # the range silently fills up with hundreds of upstream commits.
          base=$(git merge-base origin/master origin/noinstall/core)
          commits=$(git rev-list --reverse "${base}..origin/noinstall/core" --not "refs/tags/${tag}")
          stale=$(( $(git rev-list --count "${base}..origin/noinstall/core") \
                    - $(git rev-list --count "${base}..origin/noinstall/core" --not "refs/tags/${tag}") ))
          if [ "${stale}" -gt 0 ]; then
            {
              echo "### :warning: origin/master is stale"
              echo ""
              echo "${stale} upstream commit(s) were filtered out of the cherry-pick range."
              echo "This run is unaffected, but fix the anchor so the merge-base moves forward:"
              echo ""
              echo '```'
              echo "git checkout master && git merge upstream/master && git push origin master"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          git checkout -B "noinstall/${tag}" "refs/tags/${tag}"
          if ! git cherry-pick ${commits}; then
            conflicts=$(git diff --name-only --diff-filter=U || true)
            {
              echo "## Cherry-pick conflict for ${tag}"
              echo ""
              echo "The NoInstall commits no longer apply cleanly onto upstream tag ${tag}."
              echo ""
              echo "**Conflicting files:**"
              echo ""
              echo '```'
              echo "${conflicts}"
              echo '```'
              echo ""
              echo "### :warning: A clean cherry-pick does NOT mean it builds"
              echo ""
              echo "When upstream deletes or moves an API, call sites that neither side"
              echo "edited keep naming the old symbol. Git reports no conflict, and the"
              echo "build only fails later - here in CI, one platform at a time. The"
              echo "2126.0-rc5 sync had one visible conflict in file_util.cpp and seven"
              echo "silent breaks across three further files. **Build before you push.**"
              echo ""
              echo "### Option A - rebase the feature branch (preferred)"
              echo ""
              echo "Use this whenever upstream refactored: it fixes every future release,"
              echo "not just this one."
              echo ""
              echo '```'
              echo "git fetch upstream --tags"
              echo "git checkout master && git merge upstream/master && git push origin master"
              echo "git checkout noinstall/core"
              echo "git rebase --onto ${tag} ${base}"
              echo "#   ...resolve conflicts, then BUILD AND TEST (see below)..."
              echo "git push --force-with-lease origin noinstall/core"
              echo '```'
              echo ""
              echo "Afterwards this must print the commit that ${tag} points at:"
              echo ""
              echo '```'
              echo "git merge-base origin/master origin/noinstall/core"
              echo '```'
              echo ""
              echo "### Option B - prepare this one release by hand"
              echo ""
              echo "Leaves noinstall/core broken for the next release, so prefer Option A."
              echo ""
              echo '```'
              echo "git fetch upstream --tags"
              echo "git checkout -b noinstall/${tag} ${tag}"
              echo "git cherry-pick ${base}..noinstall/core   # fix conflicts as prompted"
              echo "#   ...BUILD AND TEST (see below)..."
              echo "git push -f origin noinstall/${tag}"
              echo '```'
              echo ""
              echo "This workflow reuses an existing noinstall/${tag} branch as-is."
              echo ""
              echo "### Required before pushing, either way"
              echo ""
              echo "Full recipe in \`docs/NOINSTALL.md\` section 4. Minimum:"
              echo ""
              echo '```'
              echo "git submodule update --init --recursive"
              echo "mkdir -p build/dev && cd build/dev"
              echo "cmake ../.. -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo \\"
              echo "  -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "ninja"
              echo "./bin/RelWithDebInfo/tests"
              echo '```'
              echo ""
              echo "Warnings are errors, and MSVC flags things clang does not - a green"
              echo "local build still leaves the Windows job as the real gate."
              echo ""
              echo "### Finding the silent breaks"
              echo ""
              echo "Upstream breaks callers in two ways, so there are two greps. Neither"
              echo "replaces building - they only tell you where to look first."
              echo ""
              echo "**1. Qualified names that moved.** This is what caught"
              echo "\`Loader::MakeMagic\` -> \`FileUtil::MakeMagic\` in the 2126.0-rc5 sync."
              echo "Names your own commits introduce are listed too; ignore those."
              echo ""
              echo '```'
              echo "tag=${tag}"
              echo 'git diff "$tag" HEAD | grep "^+" \'
              echo '  | grep -oE "[A-Z][A-Za-z0-9_]*::[A-Za-z_][A-Za-z0-9_]*" | sort -u \'
              echo '  | while read -r q; do'
              echo '      git grep -q "$q" "$tag" -- src/ || echo "GONE UPSTREAM: $q"'
              echo '    done'
              echo '```'
              echo ""
              echo "**2. Member functions that were deleted.** A member call is not a"
              echo "qualified name, so grep 1 cannot see it. This is what caught"
              echo "\`IOFile::IsCompressed()\`. Note there is no \`\\b\` in the regex -"
              echo "git grep's ERE does not support it and silently matches almost nothing."
              echo ""
              echo '```'
              echo "base=${base}"
              echo "tag=${tag}"
              echo 'git grep -hoE "[A-Za-z_][A-Za-z0-9_]*\(" "$base" -- "*.h" | tr -d "(" | sort -u > /tmp/old'
              echo 'git grep -hoE "[A-Za-z_][A-Za-z0-9_]*\(" "$tag"  -- "*.h" | tr -d "(" | sort -u > /tmp/new'
              echo 'git diff "$tag" HEAD | grep "^+" > /tmp/added'
              echo 'comm -23 /tmp/old /tmp/new | while read -r m; do'
              echo '  grep -qE "[.>]${m}\(" /tmp/added && echo "GONE UPSTREAM (member): $m"'
              echo 'done'
              echo '```'
              echo ""
              echo "Then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git push -f origin "noinstall/${tag}"

  macos:
    needs: [check, prepare]
    runs-on: macos-26
    env:
      OS: macos
      TARGET: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: noinstall/${{ needs.check.outputs.tag }}
          submodules: recursive
      - name: Install tools
        run: brew install ccache ninja spirv-tools
      - name: Build and test
        run: BUILD_ARCH=arm64 ./.ci/macos.sh
      - name: Pack
        run: |
          mkdir -p build/bundle
          mv build/arm64/bundle/Azahar.app build/bundle/
          ./.ci/pack.sh
          cd artifacts
          for f in *; do mv "$f" "azahar-${{ needs.check.outputs.tag }}-noinstall-macos-arm64.${f##*.}"; done
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: artifacts/

  windows:
    needs: [check, prepare]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash {0}
    env:
      OS: windows
      TARGET: msvc
    steps:
      - uses: actions/checkout@v6
        with:
          ref: noinstall/${{ needs.check.outputs.tag }}
          submodules: recursive
      - name: Set up MSVC
        uses: azahar-emu/msvc-dev-cmd@v1
      - name: Install extra tools
        run: choco install ccache ninja ptime wget
        shell: pwsh
      - name: Install vulkan-sdk
        run: |
          wget https://sdk.lunarg.com/sdk/download/1.4.304.1/windows/VulkanSDK-1.4.304.1-Installer.exe -O D:/a/_temp/vulkan.exe
          D:/a/_temp/vulkan.exe --accept-licenses --default-answer --confirm-command install
        shell: pwsh
      - name: Disable line ending translation
        run: git config --global core.autocrlf input
      - name: Build
        run: ./.ci/windows.sh
      - name: Pack
        run: |
          ./.ci/pack.sh
          cd artifacts
          for f in *; do mv "$f" "azahar-${{ needs.check.outputs.tag }}-noinstall-windows-msvc.${f##*.}"; done
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: artifacts/

  android:
    needs: [check, prepare]
    runs-on: ubuntu-latest
    env:
      OS: android
      TARGET: vanilla
    steps:
      - uses: actions/checkout@v6
        with:
          ref: noinstall/${{ needs.check.outputs.tag }}
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache apksigner -y
      - name: Update Android SDK CMake version
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"
      - name: Build
        run: JAVA_HOME=$JAVA_HOME_17_X64 ./.ci/android.sh
      - name: Pack
        run: |
          UNPACKED=1 ../../../.ci/pack.sh
          cd artifacts
          for f in *; do mv "$f" "azahar-${{ needs.check.outputs.tag }}-noinstall-android.${f##*.}"; done
        working-directory: src/android/app
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: src/android/app/artifacts/

  publish:
    needs: [check, prepare, macos, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: noinstall/${{ needs.check.outputs.tag }}
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          # NOT dist/ - the repo already has a dist/ directory (packaging files)
          # that would otherwise be globbed into the release upload.
          path: release-artifacts/
      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.check.outputs.tag }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Force so a re-run after a failed publish can re-tag cleanly.
          git tag -f "${tag}-noinstall"
          git push -f origin "refs/tags/${tag}-noinstall"
          {
            echo "Automated build of upstream [Azahar ${tag}](https://github.com/azahar-emu/azahar/releases/tag/${tag}) with the NoInstall feature (branch \`noinstall/core\`) merged on top."
            echo ""
            echo "- **macOS** (Apple Silicon): unsigned - after unzipping, run \`xattr -cr Azahar.app\` once before first launch."
            echo "- **Windows** (x64, MSVC build)."
            echo "- **Android**: debug-signed APK/AAB (sideload the APK; uninstall differently-signed Azahar variants first)."
          } > release-notes.md
          prerelease_flag=""
          if [ '${{ needs.check.outputs.prerelease }}' = "true" ]; then
            prerelease_flag="--prerelease"
          fi
          # Only upload the built artifact files.
          shopt -s nullglob
          assets=(release-artifacts/*.zip release-artifacts/*.apk release-artifacts/*.aab)
          gh release create "${tag}-noinstall" \
            --title "Azahar ${tag} + NoInstall" \
            --notes-file release-notes.md \
            $prerelease_flag \
            "${assets[@]}"
      - name: Re-dispatch if more releases are pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run noinstall-autosync -R "${GITHUB_REPOSITORY}" || true
