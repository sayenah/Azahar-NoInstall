name: noinstall-build

# Builds the current noinstall/core for Windows (MSVC) and uploads the packed
# build as an artifact, without tagging or publishing a release. It is the
# MSVC gate for feature work between upstream releases (citra-build is
# disabled on this fork, and noinstall-autosync only builds when upstream
# ships a release), and a way to get a Windows build of unreleased changes.

on:
  push:
    branches: [ "noinstall/core" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tools/**"
      - ".github/workflows/noinstall-autosync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash {0}
    env:
      OS: windows
      TARGET: msvc
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up MSVC
        uses: azahar-emu/msvc-dev-cmd@v1
      - name: Install extra tools
        run: choco install ccache ninja ptime wget
        shell: pwsh
      - name: Install vulkan-sdk
        run: |
          wget https://sdk.lunarg.com/sdk/download/1.4.304.1/windows/VulkanSDK-1.4.304.1-Installer.exe -O D:/a/_temp/vulkan.exe
          D:/a/_temp/vulkan.exe --accept-licenses --default-answer --confirm-command install
        shell: pwsh
      - name: Disable line ending translation
        run: git config --global core.autocrlf input
      - name: Build
        run: ./.ci/windows.sh
      - name: Pack
        run: |
          ./.ci/pack.sh
          cd artifacts
          for f in *; do mv "$f" "azahar-noinstall-core-${GITHUB_SHA::9}-windows-msvc.${f##*.}"; done
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: noinstall-core-windows-msvc
          path: artifacts/
